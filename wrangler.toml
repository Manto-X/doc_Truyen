# Cloudflare Worker Configuration — doc_Truyen Root SSOT
name = "story-reader-bridge"
main = "scripts/cloudflare-worker/worker_all_in_one.js"
compatibility_date = "2024-09-23"

# Route cấu hình trên toha.us custom domain (Zone: toha.us)
routes = [
  { pattern = "*toha.us/ai/read/*", zone_name = "toha.us" }
]

# Biến môi trường thông thường (không nhạy cảm)
[vars]
READER_BRIDGE_ALLOWED_HOSTS = "tamlinh247.biz,truyenfull.vision,truyenchu.net"

# Secret READER_BRIDGE_TOKEN được thêm qua lệnh:
# npx wrangler secret put READER_BRIDGE_TOKEN
# hoặc thêm trực tiếp trong Cloudflare Dashboard: Settings > Variables > Secret
